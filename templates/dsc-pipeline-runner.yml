# GitLab CI/CD component: dsc-pipeline-runner
#
# Adds one job that runs Dsc.PipelineRunner. Include it with:
#
#   include:
#     - component: $CI_SERVER_FQDN/<group>/dsc-pipelinerunner-actions/dsc-pipeline-runner@1
#       inputs:
#         configuration_path: config
#         module_version: 1.2.1
#
# Requirements (the job checks these and lists everything that is missing in one pass):
#   - An image (or shell runner) with PowerShell 7 (pwsh). The default image has it.
#   - Outbound HTTPS to raw.githubusercontent.com (to fetch the step script) and to the
#     PowerShell Gallery (unless skip_module_install is true).
#   - The dsc command-line engine in the image when engine is DscV3.
#
# Secrets are NOT inputs. Define them as masked CI/CD variables in the project or group:
#   DSCPR_SOURCE_TOKEN          token to clone configuration_repository_url (private repositories)
#   DSCPR_AZURE_DEVOPS_TOKEN    Azure DevOps personal access token (connect: AzureDevOps, PAT)
#
# Full list of requirements: docs/requirements.md. Every setting: docs/settings.md.

spec:
  inputs:
    job_name:
      description: 'Name of the job this component adds.'
      default: 'dsc-pipeline-runner'
    stage:
      description: 'Stage the job runs in. The stage must exist in the pipeline.'
      default: 'test'
    image:
      description: 'Container image for the job. It must contain PowerShell 7 (pwsh); for the DscV3 engine it must also contain dsc. Ignored by shell runners.'
      default: 'mcr.microsoft.com/dotnet/sdk:8.0'
    runner_tags:
      description: 'Runner tags, for example to select a Windows runner for the DscV2 engine.'
      type: array
      default: []
    actions_ref:
      description: 'Tag or commit of Dsc.PipelineRunnerActions that the step script is fetched from. Pin a full commit SHA to make the fetched script immutable.'
      default: 'v1'
    configuration_path:
      description: 'Directory that holds the Datum configuration (the folder containing Datum.yml), relative to the working directory. Set this or configuration-repository-url, not both.'
      default: ''
    configuration_repository_url:
      description: 'HTTPS or SSH URL of a Git repository that holds the Datum configuration. The runner clones it. Set this or configuration-path, not both. Requires git on the agent.'
      default: ''
    configuration_revision:
      description: 'Branch, tag or commit to check out when configuration-repository-url is set. A full 40-character commit SHA is verified after the clone and is the recommended value.'
      default: ''
    mode:
      description: 'Test reports drift and changes nothing. Set applies the configuration. DryRun validates the configuration without calling an engine, connecting to a target or reading a credential.'
      default: 'Test'
      options: ['Test', 'Set', 'DryRun']
    engine:
      description: 'DscV2 uses Invoke-DscResource (PowerShell resources; most are Windows-only). DscV3 uses the dsc command-line engine, which must already be installed and on PATH.'
      default: 'DscV2'
      options: ['DscV2', 'DscV3']
    engine_version:
      description: 'Optional engine version passed to the runner (-EngineVersion). Leave empty for the engine''s default.'
      default: ''
    fail_on_error:
      description: 'Fail the step when the run status is Failed or Aborted. In Test mode drift counts as a failure, so this makes a Test run a compliance gate.'
      default: 'true'
      options: ['true', 'false']
    report_path:
      description: 'Directory for the reports (CSV and JSON per node, report.json, and this integration''s result.json and outputs.env). Created if missing. Publish it as a build artifact.'
      default: 'dsc-reports'
    connect:
      description: 'AzureDevOps opens an Azure DevOps session before the run, for configurations that manage Azure DevOps with AzureDevOpsDscNative. That module must be installed (list it in resource-modules).'
      default: 'None'
      options: ['None', 'AzureDevOps']
    azure_devops_organization:
      description: 'Azure DevOps organization name. Required when connect is AzureDevOps.'
      default: ''
    azure_devops_authentication:
      description: 'How to authenticate to Azure DevOps. PAT needs azure-devops-token. ManagedIdentity needs an agent that runs with an Azure managed identity.'
      default: 'PAT'
      options: ['PAT', 'ManagedIdentity']
    module_version:
      description: 'Exact Dsc.PipelineRunner version to install, for example 1.2.1. Pinning is recommended. Empty uses a version already on the agent, otherwise installs the newest stable release.'
      default: ''
    allow_prerelease:
      description: 'Allow a preview version of Dsc.PipelineRunner (needed when module-version names one, for example 1.3.0-preview1).'
      default: 'false'
      options: ['true', 'false']
    module_repository:
      description: 'Registered PowerShell repository to install modules from. Use this for an internal feed; the repository must already be registered on the agent.'
      default: 'PSGallery'
    resource_modules:
      description: 'DSC resource modules the configuration uses, one per line or comma-separated, as Name or Name@Version (for example PSDscResources@2.12.0.0). Pinning versions is recommended.'
      default: ''
    skip_module_install:
      description: 'Install nothing. Use on agents or container images where Dsc.PipelineRunner and the resource modules are already present, or where the agent has no access to a module repository.'
      default: 'false'
      options: ['true', 'false']
    keep_temporary_directory:
      description: 'Keep the clone and the compiled per-node YAML on disk after the run, to debug a compile failure.'
      default: 'false'
      options: ['true', 'false']
    verbose:
      description: 'Write the runner''s verbose log.'
      default: 'false'
      options: ['true', 'false']
---
'$[[ inputs.job_name ]]':
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.image ]]
  tags: $[[ inputs.runner_tags ]]
  variables:
    DSCPR_PLATFORM: gitlab
    DSCPR_STEP_DIRECTORY: .dsc-pipeline-runner
    DSCPR_STEP_SCRIPT: Invoke-DscPipelineRunnerStep.ps1
    DSCPR_CORE_FILES: Invoke-DscPipelineRunnerStep.ps1,settings.json
    DSCPR_CORE_URL: https://raw.githubusercontent.com/ZanattaMichael/Dsc.PipelineRunnerActions/$[[ inputs.actions_ref ]]/core/
    DSCPR_CONFIGURATION_PATH: '$[[ inputs.configuration_path ]]'
    DSCPR_CONFIGURATION_REPOSITORY_URL: '$[[ inputs.configuration_repository_url ]]'
    DSCPR_CONFIGURATION_REVISION: '$[[ inputs.configuration_revision ]]'
    DSCPR_MODE: '$[[ inputs.mode ]]'
    DSCPR_ENGINE: '$[[ inputs.engine ]]'
    DSCPR_ENGINE_VERSION: '$[[ inputs.engine_version ]]'
    DSCPR_FAIL_ON_ERROR: '$[[ inputs.fail_on_error ]]'
    DSCPR_REPORT_PATH: '$[[ inputs.report_path ]]'
    DSCPR_CONNECT: '$[[ inputs.connect ]]'
    DSCPR_AZURE_DEVOPS_ORGANIZATION: '$[[ inputs.azure_devops_organization ]]'
    DSCPR_AZURE_DEVOPS_AUTHENTICATION: '$[[ inputs.azure_devops_authentication ]]'
    DSCPR_MODULE_VERSION: '$[[ inputs.module_version ]]'
    DSCPR_ALLOW_PRERELEASE: '$[[ inputs.allow_prerelease ]]'
    DSCPR_MODULE_REPOSITORY: '$[[ inputs.module_repository ]]'
    DSCPR_RESOURCE_MODULES: '$[[ inputs.resource_modules ]]'
    DSCPR_SKIP_MODULE_INSTALL: '$[[ inputs.skip_module_install ]]'
    DSCPR_KEEP_TEMPORARY_DIRECTORY: '$[[ inputs.keep_temporary_directory ]]'
    DSCPR_VERBOSE: '$[[ inputs.verbose ]]'
  script:
    # One command, written so that it is valid in sh, bash and PowerShell job shells alike.
    - pwsh -NoLogo -NoProfile -NonInteractive -Command 'New-Item -ItemType Directory -Force -Path $env:DSCPR_STEP_DIRECTORY | Out-Null; foreach ($file in $env:DSCPR_CORE_FILES.Split([char]44)) { Invoke-WebRequest -Uri ($env:DSCPR_CORE_URL + $file) -OutFile (Join-Path $env:DSCPR_STEP_DIRECTORY $file) }; & (Join-Path $env:DSCPR_STEP_DIRECTORY $env:DSCPR_STEP_SCRIPT); exit $LASTEXITCODE'
  artifacts:
    when: always
    paths:
      - $[[ inputs.report_path ]]
    reports:
      dotenv: $[[ inputs.report_path ]]/outputs.env
