# Example: manage this Azure DevOps organization. AzureDevOpsPat is a secret variable (pipeline
# settings or a variable group). Secret variables are not given to tasks automatically; pass it
# as the input, as below.
trigger: none

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
  - task: DscPipelineRunner@1
    inputs:
      configurationPath: config
      mode: Set
      connect: AzureDevOps
      azureDevopsOrganization: contoso
      azureDevopsAuthentication: PAT
      azureDevopsToken: $(AzureDevOpsPat)
      moduleVersion: 1.2.1
      resourceModules: AzureDevOpsDscNative
