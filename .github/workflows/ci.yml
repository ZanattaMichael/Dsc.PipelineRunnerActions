name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Run Pester
        shell: pwsh
        run: |
          # Pester 5 ships on GitHub-hosted runners.
          Import-Module Pester -MinimumVersion 5.3.0
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = 'tests'
          $configuration.Run.Exit = $true
          $configuration.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $configuration

  github-action:
    name: GitHub Action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Use the stand-in module
        shell: pwsh
        run: |
          # The action itself is under test, not Dsc.PipelineRunner: a stand-in module makes the
          # result predictable. It records the arguments the action passed.
          $modules = Join-Path $env:GITHUB_WORKSPACE 'tests/fixtures/modules'
          "PSModulePath=$modules$([IO.Path]::PathSeparator)$env:PSModulePath" >> $env:GITHUB_ENV
          "DSCPR_TEST_CALL_FILE=$(Join-Path $env:RUNNER_TEMP 'call.json')" >> $env:GITHUB_ENV
      - name: Run the action
        id: dsc
        uses: ./
        with:
          configuration-path: tests/fixtures/config
          mode: Set
          skip-module-install: 'true'
      - name: Check outputs and arguments
        shell: pwsh
        env:
          STATUS: ${{ steps.dsc.outputs.status }}
          PASS_COUNT: ${{ steps.dsc.outputs.pass-count }}
          REPORT_PATH: ${{ steps.dsc.outputs.report-path }}
        run: |
          if ($env:STATUS -ne 'Completed') { throw "status output is '$env:STATUS'" }
          if ($env:PASS_COUNT -ne '3') { throw "pass-count output is '$env:PASS_COUNT'" }
          if (-not (Test-Path (Join-Path $env:REPORT_PATH 'result.json'))) { throw 'result.json is missing' }
          $call = Get-Content $env:DSCPR_TEST_CALL_FILE -Raw | ConvertFrom-Json
          if ($call.Mode -ne 'Set') { throw "the runner was called with Mode '$($call.Mode)'" }
      - name: Invalid settings must fail the step
        id: invalid
        continue-on-error: true
        uses: ./
        with:
          mode: Apply
      - name: Check the failure
        shell: pwsh
        env:
          OUTCOME: ${{ steps.invalid.outcome }}
        run: if ($env:OUTCOME -ne 'failure') { throw "invalid settings gave outcome '$env:OUTCOME'" }

  real-module:
    # The one job that uses the real Dsc.PipelineRunner from the PowerShell Gallery.
    name: Real module (install and run)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - id: dsc
        uses: ./
        with:
          configuration-path: tests/fixtures/real-config
          mode: Test
          module-version: 1.2.1
          resource-modules: PSDscResources@2.12.0.0
          fail-on-error: 'false'
      - shell: pwsh
        env:
          STATUS: ${{ steps.dsc.outputs.status }}
          TOTAL: ${{ steps.dsc.outputs.total-resources }}
          VERSION: ${{ steps.dsc.outputs.module-version }}
        run: |
          "status=$env:STATUS total=$env:TOTAL version=$env:VERSION"
          if ($env:VERSION -ne '1.2.1') { throw "module-version output is '$env:VERSION'" }
          if ($env:STATUS -notin 'Completed', 'Failed') { throw "status output is '$env:STATUS'" }
          if ([int]$env:TOTAL -lt 1) { throw 'no resource was evaluated' }

  module-from-source:
    # Builds Dsc.PipelineRunner from its source repository at a pinned commit and runs that build.
    # This is also the job that exercises DryRun, which no published release has yet.
    # Linux uses the DSC v3 engine: DSC v2 needs the OMI library (libmi), which a stock Linux
    # runner does not have.
    name: Module from source (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            configuration: tests/fixtures/real-config
            engine: DscV2
            resource-modules: PSDscResources@2.12.0.0
            ref: fe1560dfeca6f2692a2acdebb7eb4ea14e9ba484
          - os: ubuntu-latest
            configuration: tests/fixtures/real-config-v3
            engine: DscV3
            resource-modules: ''
            # The first commit whose resource pre-check works on Linux (DSC v3 engine).
            ref: f6fd5ae752d87df13514cc359b0644d35a30da22
    steps:
      - uses: actions/checkout@v4
      - id: dsc
        uses: ./
        with:
          configuration-path: ${{ matrix.configuration }}
          mode: DryRun
          engine: ${{ matrix.engine }}
          module-source: Repository
          module-source-ref: ${{ matrix.ref }}
          resource-modules: ${{ matrix.resource-modules }}
      - shell: pwsh
        env:
          STATUS: ${{ steps.dsc.outputs.status }}
          TOTAL: ${{ steps.dsc.outputs.total-resources }}
          VERSION: ${{ steps.dsc.outputs.module-version }}
        run: |
          "status=$env:STATUS total=$env:TOTAL version=$env:VERSION"
          if (-not $env:VERSION) { throw 'module-version output is empty' }
          if ($env:STATUS -ne 'Completed') { throw "status output is '$env:STATUS'" }
          if ([int]$env:TOTAL -lt 1) { throw 'no resource was evaluated' }

  capability-policy:
    # The capability policy end to end, through the action and the real module (built from the
    # module commit that reads Policy.yml beside Datum.yml): a configuration that complies runs,
    # and the same configuration with a team resource on a forbidden Target is refused.
    name: Capability policy (real module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A configuration that complies with its Policy.yml
        id: complies
        uses: ./
        with:
          configuration-path: tests/fixtures/policy-config
          mode: DryRun
          engine: DscV3
          require-policy: 'true'
          module-source: Repository
          module-source-ref: af026c23d6b2febad6ecff06d357883683e86850
      - name: Break the policy
        shell: pwsh
        run: Copy-Item tests/fixtures/policy-config-violating/App.yml tests/fixtures/policy-config/Projects/Present/App.yml -Force
      - name: The same configuration, now breaking the policy
        id: violates
        continue-on-error: true
        uses: ./
        with:
          configuration-path: tests/fixtures/policy-config
          mode: DryRun
          engine: DscV3
          require-policy: 'true'
          report-path: dsc-reports-violating
          module-source: Repository
          module-source-ref: af026c23d6b2febad6ecff06d357883683e86850
      - name: Remove the policy
        shell: pwsh
        run: Remove-Item tests/fixtures/policy-config/Policy.yml
      - name: The configuration with its policy removed, where one is required
        id: stripped
        continue-on-error: true
        uses: ./
        with:
          configuration-path: tests/fixtures/policy-config
          mode: DryRun
          engine: DscV3
          require-policy: 'true'
          report-path: dsc-reports-stripped
          module-source: Repository
          module-source-ref: af026c23d6b2febad6ecff06d357883683e86850
      - name: Check the three outcomes
        shell: pwsh
        env:
          COMPLIES_STATUS: ${{ steps.complies.outputs.status }}
          COMPLIES_TOTAL: ${{ steps.complies.outputs.total-resources }}
          VIOLATES_OUTCOME: ${{ steps.violates.outcome }}
          VIOLATES_STATUS: ${{ steps.violates.outputs.status }}
          STRIPPED_OUTCOME: ${{ steps.stripped.outcome }}
          STRIPPED_STATUS: ${{ steps.stripped.outputs.status }}
        run: |
          "complies: $env:COMPLIES_STATUS ($env:COMPLIES_TOTAL resources); violates: $env:VIOLATES_OUTCOME / $env:VIOLATES_STATUS; stripped: $env:STRIPPED_OUTCOME / $env:STRIPPED_STATUS"
          if ($env:COMPLIES_STATUS -ne 'Completed' -or [int]$env:COMPLIES_TOTAL -ne 2) { throw 'The compliant configuration did not complete with its two resources.' }
          if ($env:VIOLATES_OUTCOME -ne 'failure' -or $env:VIOLATES_STATUS -notin 'Aborted', 'Failed') { throw 'The configuration that breaks the policy was not refused.' }
          if ($env:STRIPPED_OUTCOME -ne 'failure' -or $env:STRIPPED_STATUS -ne 'InvalidSettings') { throw 'A configuration without its required policy was not refused before the run.' }

  azure-devops-task:
    # The packaged task (what would be published) is run the way an Azure Pipelines agent runs a
    # Node task, once per case. See tests/integration/azure-devops/README.md.
    name: Azure DevOps task and extension (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 20 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests of the task entry point and of the test harness
        run: node --test azure-devops/tests/index.test.js tests/integration/azure-devops/agent.test.js tests/integration/azure-devops/live/pipeline.test.js
      - name: Package the extension
        shell: pwsh
        run: |
          ./tools/Sync-Core.ps1 -AzureDevOps
          ./tools/Set-AzureDevOpsVersion.ps1 -Version 0.0.1
          npx --yes tfx-cli@0 extension create --root azure-devops --manifest-globs vss-extension.json --output-path dist
          if ($LASTEXITCODE -ne 0) { throw 'tfx could not package the extension' }
          Get-ChildItem dist
      - name: Run the cases against the packaged task
        shell: pwsh
        run: |
          node tests/integration/azure-devops/run-cases.js --vsix (Get-ChildItem dist/*.vsix).FullName
          if ($LASTEXITCODE -ne 0) { throw 'an Azure DevOps integration case failed' }
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.node == 20
        with:
          name: azure-devops-extension-ci
          path: dist/*.vsix

  azure-devops-live:
    # The same cases on a real agent in a real Azure DevOps organization. Runs only where the
    # organization is configured (tests/integration/azure-devops/README.md); otherwise skipped.
    name: Azure DevOps live
    if: vars.AZURE_DEVOPS_TEST_ORG != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # One run at a time: every run uploads the test copy of the task under the same id.
    concurrency:
      group: azure-devops-live
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run the cases in Azure DevOps
        env:
          DSCPR_AZDO_ORG: ${{ vars.AZURE_DEVOPS_TEST_ORG }}
          DSCPR_AZDO_PROJECT: ${{ vars.AZURE_DEVOPS_TEST_PROJECT }}
          DSCPR_AZDO_POOL: ${{ vars.AZURE_DEVOPS_TEST_POOL }}
          DSCPR_AZDO_VM_IMAGE: ${{ vars.AZURE_DEVOPS_TEST_VM_IMAGE }}
          DSCPR_AZDO_TOKEN: ${{ secrets.AZURE_DEVOPS_TEST_TOKEN }}
        run: node tests/integration/azure-devops/live/run-live.js

  jenkins-integration:
    # A real Jenkins controller in Docker loads the shared library and runs pipelines that call
    # the step. See tests/integration/jenkins/Invoke-JenkinsIntegrationTests.ps1.
    name: Jenkins integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the cases in Jenkins
        shell: pwsh
        run: ./tests/integration/jenkins/Invoke-JenkinsIntegrationTests.ps1

  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: YAML and JSON parse
        run: |
          python3 - <<'PY'
          import glob, json, sys, yaml
          for path in ['action.yml', 'circleci/orb.yml', 'templates/dsc-pipeline-runner.yml', '.gitlab-ci.yml'] + glob.glob('examples/**/*.yml', recursive=True) + glob.glob('.github/workflows/*.yml'):
              list(yaml.safe_load_all(open(path)))
              print('ok', path)
          for path in ['core/settings.json', 'azure-devops/vss-extension.json', 'azure-devops/DscPipelineRunnerTask/task.json'] + glob.glob('tests/integration/azure-devops/cases/*/case.json'):
              json.load(open(path))
              print('ok', path)
          PY
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          # PSScriptAnalyzer ships on GitHub-hosted runners.
          $findings = 'core', 'tools' | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Recurse -Severity Error, Warning -ExcludeRule PSAvoidUsingWriteHost, PSAvoidUsingConvertToSecureStringWithPlainText }
          $findings | Format-Table -AutoSize
          if ($findings) { throw "$(@($findings).Count) PSScriptAnalyzer finding(s)" }
