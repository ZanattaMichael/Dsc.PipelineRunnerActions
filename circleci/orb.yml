examples:
  test-a-configuration:
    description: Report drift for the configuration in ./config and fail the job when there is any.
    usage:
      version: 2.1
      orbs:
        dsc-pipeline-runner: zanattamichael/dsc-pipeline-runner@1
      workflows:
        compliance:
          jobs:
            - dsc-pipeline-runner/run:
                configuration-path: config
                engine: DscV3
                module-version: 1.2.1
